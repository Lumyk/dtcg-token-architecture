name: Validate tokens

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate token contracts and contrast
        run: python -B scripts/validate_dtcg.py
      - name: Test rejection of invalid tokens
        run: python -B -m unittest discover -s tests -v
